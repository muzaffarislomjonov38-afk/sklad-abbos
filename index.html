+function getNetlifySyncHeaders() {

+    if (!data || typeof data !== 'object') return '';

+async function fetchNetlifySharedData() {
+    const response = await fetch(NETLIFY_SYNC_ENDPOINT, {
+        method: 'GET',
+        headers: getNetlifySyncHeaders(),

+    });
+    if (!response.ok) throw new Error(`HTTP ${response.status}`);
+    const result = await response.json();
+    return result && result.data && typeof result.data === 'object' ? result.data : {};
+}
+
+function applyNetlifyRemoteData(remoteData, force = false) {
+    if (!remoteData || !Object.keys(remoteData).length) return false;
+    const remoteStamp = getNetlifyDataStamp(remoteData);
+    if (!force && remoteStamp && remoteStamp === netlifyLastRemoteStamp) return false;
+    if (netlifyLocalDirty || netlifySaveInFlight) return false;

+    netlifyApplyingRemoteData = true;
+    try {
+        const applied = applyRemoteSharedAppData(remoteData);
+        if (applied) netlifyLastRemoteStamp = remoteStamp || new Date().toISOString();
+        return applied;
+    } finally {
+        netlifyApplyingRemoteData = false;
+    }
+}
